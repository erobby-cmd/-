<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C6B75">
<title>יומן סצנות מרחב אילת</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&family=Heebo:wght@400;500;700&display=swap">
<style id="app-style">
:root{
  --bg:#E7E9EB; --surface:#FFFFFF; --surface-2:#F1F3F4;
  --ink:#13171C; --ink-2:#4E5763; --ink-3:#79838F;
  --line:#D2D7DB; --line-2:#BFC6CC;
  --accent:#0C6B75; --accent-ink:#FFFFFF;
  --shot:#1E7A4E; --shot-soft:#D9EDE2;
  --partial:#9A6206; --partial-soft:#F3E6CE;
  --todo:#A8305C; --todo-soft:#F7DCE7; --pinkbg:#FCE9F0;
  --dropped:#8B3A3A; --dropped-soft:#EEDCDC;
  --shadow:0 1px 2px rgba(19,23,28,.06),0 8px 24px rgba(19,23,28,.05);
  --reddot:#E11D48;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1115; --surface:#171B21; --surface-2:#1D232A;
    --ink:#E7EBEF; --ink-2:#98A2AD; --ink-3:#727C88;
    --line:#282F38; --line-2:#39424D;
    --accent:#38B0BB; --accent-ink:#06181B;
    --shot:#4CC08D; --shot-soft:#123328;
    --partial:#DEA246; --partial-soft:#33270F;
    --todo:#EC96B6; --todo-soft:#3A1E29; --pinkbg:#2C1720;
    --dropped:#CE8181; --dropped-soft:#331B1B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --reddot:#FF5C7A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --surface-2:#1D232A;
  --ink:#E7EBEF; --ink-2:#98A2AD; --ink-3:#727C88;
  --line:#282F38; --line-2:#39424D;
  --accent:#38B0BB; --accent-ink:#06181B;
  --shot:#4CC08D; --shot-soft:#123328;
  --partial:#DEA246; --partial-soft:#33270F;
  --todo:#EC96B6; --todo-soft:#3A1E29; --pinkbg:#2C1720;
  --dropped:#CE8181; --dropped-soft:#331B1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --reddot:#FF5C7A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px 110px}
.mast{border-bottom:1px solid var(--line);background:var(--surface)}
.mast-in{max-width:1100px;margin:0 auto;padding:34px 20px 0}
.eyebrow{font-family:"Heebo",sans-serif;font-size:12px;font-weight:500;letter-spacing:.16em;color:var(--accent);margin:0 0 8px}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:10px 0 0;max-width:62ch;font-size:15.5px}
.stats{display:flex;flex-wrap:wrap;margin:26px 0 0;border-top:1px solid var(--line)}
.stat{flex:1 1 104px;padding:14px 16px 16px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0;padding-inline-start:0}
.stat.s-shift b{color:var(--accent)}
.stat b{display:block;font-family:"Heebo",sans-serif;font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-3);font-family:"Heebo",sans-serif;letter-spacing:.04em}
.stat.s-shot b{color:var(--shot)}.stat.s-partial b{color:var(--partial)}
.stat.s-todo b{color:var(--todo)}.stat.s-min b{color:var(--accent)}
.gauge{height:6px;display:flex;border-radius:999px;overflow:hidden;margin:18px 0 10px;background:var(--surface-2)}
.gauge i{display:block;height:100%}
.tinyedit{font-family:"Heebo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.07em;background:transparent;border:1px solid var(--line-2);color:var(--ink-3);border-radius:5px;padding:2px 8px;cursor:pointer;vertical-align:middle;margin-inline-start:9px;transition:.15s}
.tinyedit:hover{color:var(--accent);border-color:var(--accent)}
.metaform{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:17px 19px 19px;margin:18px 0 4px;display:grid;gap:12px;max-width:660px}
.epform{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:13px 14px 15px;display:grid;gap:10px;margin-bottom:6px}
.method{margin:0 0 22px;font-family:"Heebo",sans-serif;font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;padding:11px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sep{width:1px;height:22px;background:var(--line-2);margin:0 4px}
.chip{font-family:"Heebo",sans-serif;font-size:13px;font-weight:500;padding:6px 13px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-inline-start:5px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn{font-family:"Heebo",sans-serif;font-size:13.5px;font-weight:500;padding:7px 15px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.btn.danger{background:transparent;color:var(--dropped);border-color:var(--dropped)}
.btn.off{opacity:.4;cursor:not-allowed}
.ubtn{display:inline-flex;align-items:center;gap:8px;font-family:"Heebo",sans-serif;font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;transition:.15s}
.ubtn:hover{border-color:var(--accent)}
.ubtn i{width:10px;height:10px;border-radius:50%;display:block;flex:none;background:var(--uc,var(--ink-3))}
.ubtn small{font-family:"Heebo",sans-serif;font-size:10.5px;font-weight:500;color:var(--ink-3)}
.upanel{position:fixed;inset:0;background:rgba(8,11,15,.6);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.upanel .ubox{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;box-shadow:0 22px 64px rgba(0,0,0,.45);overflow:hidden}
.upanel .uhead{padding:16px 22px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.upanel .uhead h3{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:20px;margin:0;font-weight:700}
.upanel .uhead p{margin:5px 0 0;font-size:13.5px;color:var(--ink-2)}
.ulist{display:flex;flex-direction:column;padding:10px}
.urow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:start;font-family:"Assistant",sans-serif;transition:.13s;width:100%}
.urow:hover{background:var(--surface-2);border-color:var(--line)}
.urow[aria-current="true"]{border-color:var(--accent);background:var(--surface-2)}
.urow i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--uc,var(--ink-3))}
.urow b{font-family:"Heebo",sans-serif;font-size:14.5px;font-weight:700;color:var(--ink)}
.urow span{font-family:"Heebo",sans-serif;font-size:11.5px;color:var(--ink-3);margin-inline-start:auto;font-variant-numeric:tabular-nums}
.urow .tagi{margin-inline-start:0}
.ufoot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.newu{display:flex;gap:8px;padding:0 16px 16px;align-items:center}
.newu input{flex:1;font-family:"Assistant",sans-serif;font-size:14px;padding:8px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink)}
.viewing{background:var(--partial-soft);color:var(--partial);border-bottom:1px solid var(--line);font-family:"Heebo",sans-serif;font-size:13px;padding:9px 20px;text-align:center}
.savebadge{display:inline-flex;align-items:center;gap:7px;font-family:"Heebo",sans-serif;font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.savebadge i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none;display:block}
.savebadge.s-ok{color:var(--shot);border-color:var(--shot)}
.savebadge.s-ok i{background:var(--shot)}
.savebadge.s-saving{color:var(--partial);border-color:var(--partial)}
.savebadge.s-saving i{background:var(--partial);animation:pulsedot 1s ease-in-out infinite}
.savebadge.s-dirty{color:var(--partial);border-color:var(--partial)}
.savebadge.s-dirty i{background:var(--partial)}
.savebadge.s-err{color:var(--dropped);border-color:var(--dropped)}
.savebadge.s-err i{background:var(--dropped)}
@keyframes pulsedot{50%{opacity:.25}}
.btn .n{font-variant-numeric:tabular-nums;opacity:.6;font-size:11px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grp{margin:52px 0 0}
.grp-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.grp-h h2{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:24px;margin:0;letter-spacing:-.005em}
.grp-h .role{font-size:14.5px;color:var(--ink-2)}
.grp-h .meta{font-family:"Heebo",sans-serif;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-inline-start:auto}
.story{margin:14px 0 0;font-size:16.5px;line-height:1.66;color:var(--ink);max-width:68ch}
.story .lab{font-family:"Heebo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);display:block;margin-bottom:5px}
.grp-note{margin:12px 0 0;font-size:14.5px;color:var(--ink-2);max-width:70ch}
.cpanel{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-top:16px;border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.cpanel>div{padding:13px 17px 15px;border-inline-start:1px solid var(--line)}
.cpanel>div:first-child{border-inline-start:0}
@media (max-width:700px){.cpanel>div{border-inline-start:0;border-top:1px solid var(--line)}.cpanel>div:first-child{border-top:0}}
.cpanel h5{font-family:"Heebo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);margin:0 0 5px}
.cpanel .want h5{color:var(--accent)}
.cpanel .wound h5{color:var(--dropped)}
.cpanel .gap h5{color:var(--partial)}
.cpanel p{margin:0;font-size:14px;color:var(--ink-2)}
.cpanel ul{margin:0;padding-inline-start:16px}
.cpanel li{font-size:13.5px;color:var(--ink-2);margin-bottom:2px}
.sub-h{display:flex;align-items:center;gap:10px;margin:26px 0 0}
.sub-h span{font-family:"Heebo",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.13em;white-space:nowrap}
.sub-h i{flex:1;height:1px;background:var(--line-2);display:block}
.sub-h.k-shot span{color:var(--shot)}
.sub-h.k-partial span{color:var(--partial)}
.sub-h.k-todo span{color:var(--todo)}
.sub-h.k-dropped span{color:var(--dropped)}
.empty{margin-top:14px;padding:22px;border:1px dashed var(--line-2);border-radius:10px;color:var(--ink-3);font-size:14.5px}
.scenes{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.scene{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.scene::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--todo)}
.scene[data-s="shot"]::before{background:var(--shot)}
.scene[data-s="partial"]::before{background:var(--partial)}
.scene[data-s="dropped"]::before{background:var(--dropped)}
.scene[data-s="dropped"]{opacity:.6}
.s-head{display:flex;gap:14px;align-items:flex-start;padding:16px 22px 14px}
.code{font-family:"Heebo",sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);padding-top:5px;font-variant-numeric:tabular-nums}
.s-title{flex:1;min-width:0}
.s-title h3{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:19px;margin:0;line-height:1.3;text-wrap:balance}
.tag{display:inline-block;font-family:"Heebo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;margin-inline-start:8px;vertical-align:middle}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.person{font-family:"Heebo",sans-serif;font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.person.unit{color:var(--accent);border-color:var(--accent);background:transparent}
.pill{font-family:"Heebo",sans-serif;font-size:12px;font-weight:500;padding:4px 12px;border-radius:999px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:.15s}
.pill:hover{filter:brightness(.96)}
.pill[data-s="shot"]{background:var(--shot-soft);color:var(--shot);border-color:var(--shot)}
.pill[data-s="partial"]{background:var(--partial-soft);color:var(--partial);border-color:var(--partial)}
.pill[data-s="todo"]{background:var(--todo-soft);color:var(--todo);border-color:var(--todo)}
.pill[data-s="dropped"]{background:var(--dropped-soft);color:var(--dropped);border-color:var(--dropped)}
.mins{font-family:"Heebo",sans-serif;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
@media (max-width:660px){.cols{grid-template-columns:1fr}}
.col{padding:14px 22px 16px}
.col+.col{border-inline-start:1px solid var(--line)}
@media (max-width:660px){.col+.col{border-inline-start:0;border-top:1px solid var(--line)}}
.col h4{font-family:"Heebo",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.1em;margin:0 0 8px;color:var(--ink-3)}
.col.have h4{color:var(--shot)}
.col.need h4{color:var(--partial)}
.col ul{margin:0;padding-inline-start:17px}
.col li{font-size:14.5px;color:var(--ink-2);margin-bottom:3px}
.col .none{font-size:14px;color:var(--ink-3);font-style:italic;margin:0}
.note{padding:12px 22px 15px;border-top:1px solid var(--line);background:var(--surface-2);font-size:14.5px;color:var(--ink-2)}
.note b{font-family:"Heebo",sans-serif;font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);display:block;margin-bottom:3px;font-weight:700}
.s-foot{display:flex;gap:8px;align-items:center;padding:10px 22px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.smove{font-family:"Heebo",sans-serif;font-size:11.5px;font-weight:500;background:var(--surface-2);border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;color:var(--ink-2);cursor:pointer}
.smove:hover{border-color:var(--accent);color:var(--accent)}
section.grp.dropok{outline:3px dashed var(--accent);outline-offset:10px;border-radius:6px}
.scenes.dropbucket{background:var(--accent-soft,rgba(12,107,117,.09));border-radius:10px;outline:2px dashed var(--accent);outline-offset:5px}
.scene{cursor:grab;-webkit-user-select:none;user-select:none}
.pnote{-webkit-user-select:none;user-select:none}
.scene .form,.scene .form *{-webkit-user-select:auto;user-select:auto;cursor:auto}
.grip{font-family:"Heebo",sans-serif;font-size:15px;line-height:1;color:var(--ink-3);padding:4px 2px 0;cursor:grab;letter-spacing:-1px}
.grip:hover{color:var(--accent)}
.movebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addgrp{display:inline-flex;gap:8px;flex-wrap:nowrap;align-items:center}
.mlab{font-family:"Heebo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
.scene:active{cursor:grabbing}
.scene.dragging{opacity:.3}
.draghint{font-family:"Heebo",sans-serif;font-size:12px;color:var(--ink-3);margin:14px 0 0}
.form{padding:18px 22px 20px;background:var(--surface-2);border-top:1px solid var(--line);display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:660px){.row{grid-template-columns:1fr}}
.f label{display:block;font-family:"Heebo",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;font-family:"Assistant",sans-serif;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px}
.f textarea{min-height:78px;resize:vertical;line-height:1.5}
.hint{font-size:12px;color:var(--ink-3);margin:4px 0 0}
.views{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.views button{font-family:"Heebo",sans-serif;font-size:13.5px;font-weight:500;padding:8px 17px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-inline-start:1px solid var(--line-2);transition:.15s}
.views button:first-child{border-inline-start:0}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.epn{font-family:"Heebo",sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent);display:block;margin-bottom:3px}
.epbar{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:9px 0 0}
.epbar i{display:block;height:100%;background:var(--accent)}
.ghost{margin-top:13px;padding:15px 13px;border:1.5px dashed #D9799C;border-radius:4px;color:var(--ink-3);font-family:"Heebo",sans-serif;font-size:12.5px;text-align:center}
.ins{height:5px;background:var(--accent);border-radius:3px;margin:-4px 0}
.arc td .ins{margin:2px 0;height:4px}
.rgrip{display:inline-block;cursor:grab;color:var(--ink-3);font-size:13px;line-height:1;padding:1px 5px;border-radius:5px;margin-inline-end:6px;vertical-align:middle;user-select:none}
.rgrip:hover{background:var(--surface-2);color:var(--ink)}
.rgrip:active{cursor:grabbing}
.arc tr.rowdrop-before>th,.arc tr.rowdrop-before>td{box-shadow:inset 0 4px 0 -1px var(--accent)}
.arc tr.rowdrop-after>th,.arc tr.rowdrop-after>td{box-shadow:inset 0 -4px 0 -1px var(--accent)}
html.linedrag .mchip{pointer-events:none}
.nedit{margin-top:9px;font-family:"Heebo",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.06em;background:rgba(0,0,0,.07);border:0;border-radius:4px;padding:3px 9px;color:inherit;cursor:pointer;opacity:.65}
.nedit:hover{opacity:1;background:rgba(0,0,0,.13)}
.modes{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-top:16px}
.modes button{font-family:"Heebo",sans-serif;font-size:12.5px;font-weight:500;padding:6px 14px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-inline-start:1px solid var(--line-2)}
.modes button:first-child{border-inline-start:0}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.board.listmode,.board.tlmode{display:block;overflow:visible;padding-bottom:0}
.epband{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.epband h3{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:20px;margin:0}
.epband .epn{display:inline;margin:0 0 0 4px}
.epband .sub{font-size:14px;color:var(--ink-2);margin:0}
.epband .bm{margin-inline-start:auto;font-family:"Heebo",sans-serif;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

function moveScene(id,ep,beforeId){

 if(!sc)return;
 var col=DATA.scenes.filter(function(x){return x.ep===ep&&x.id!==id})
  .sort(function(a,b){return (a.ord||0)-(b.ord||0)});
 var idx=col.length;
 if(beforeId) col.forEach(function(x,j){if(x.id===beforeId)idx=j});

function moveLine(k,beforeK){

 if(beforeK) L.forEach(function(x,j){if(x.k===beforeK)idx=j});

}
function moveAfter(id,ep,afterId){

  .sort(function(a,b){return (a.ord||0)-(b.ord||0)});

function autoScroll(e){
 var m=110, step=26, tm=52, tstep=16;
 if(e.clientY<0||e.clientY>window.innerHeight) return;
 var overSticky=!!(e.target&&e.target.closest&&e.target.closest(".arc th.c0"));
 if(e.clientY<m) window.scrollBy(0,-step);
 else if(window.innerHeight-e.clientY<m) window.scrollBy(0,step);
 var ts=document.querySelectorAll(".tscroll");
 for(var i=0;i<ts.length;i++){
  var tr=ts[i].getBoundingClientRect();
  if(!overSticky&&e.clientY>tr.top&&e.clientY<tr.bottom){
   if(e.clientX-tr.left<tm) ts[i].scrollLeft-=tstep;
   else if(tr.right-e.clientX<tm) ts[i].scrollLeft+=tstep;
  }
 }
 var bd=document.querySelector(".board");
 if(bd){
  var r=bd.getBoundingClientRect();
  if(e.clientY>r.top&&e.clientY<r.bottom){
   if(e.clientX-r.left<m) bd.scrollLeft-=step;
   else if(r.right-e.clientX<m) bd.scrollLeft+=step;
  }
 }
}

function gapScore(i){

/* ===== לוג ימי צילום ===== */
var HEDAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
var HEMON=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function DAYS(){ if(!DATA.days) DATA.days=[]; return DATA.days }
function dparts(s){
 var m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
 if(!m) return null;
 var d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
 if(isNaN(d.getTime())) return null;
 return {y:d.getFullYear(),m:d.getMonth(),d:d.getDate(),w:d.getDay(),t:d.getTime()};
}
function dayLabel(s){
 var p=dparts(s);
 if(!p) return "בלי תאריך";
 return p.d+"."+(p.m+1)+"."+p.y;
}
function dayWeek(s){var p=dparts(s);return p?"יום "+HEDAYS[p.w]:""}
function monthKey(s){var p=dparts(s);return p?p.y+"-"+(p.m<9?"0":"")+(p.m+1):"zzz"}
function monthLabel(s){var p=dparts(s);return p?HEMON[p.m]+" "+p.y:"בלי תאריך"}
function daysSorted(){
 return DAYS().slice().sort(function(a,b){
  var pa=dparts(a.date),pb=dparts(b.date);
  if(pa&&pb) return pb.t-pa.t;
  if(pa) return -1;
  if(pb) return 1;
  return 0;
 });
}
function dayForm(d){
 var h='<div class="grpform" data-form="__day__">';
 h+='<div class="row"><div class="f"><label>תאריך</label><input name="date" type="date" value="'+esc(d.date||"")+'"></div>';
 h+='<div class="f"><label>מיקום</label><input name="loc" value="'+esc(d.loc||"")+'" placeholder="איפה צילמנו"></div></div>';
 h+='<div class="f"><label>מי צולם</label><div class="tagbox">'+DATA.chars.map(function(c){
  return '<label><input type="checkbox" name="ch_'+c.k+'"'+(((d.chars||[]).indexOf(c.k)>-1)?" checked":"")+'>'+esc(c.name)+'</label>';
 }).join("")+'</div></div>';
 h+='<div class="f"><label>עוד מי שהיה בפריים</label><input name="people" value="'+esc(d.people||"")+'" placeholder="מופרד בפסיקים"></div>';
 h+='<div class="f"><label>רגעים חזקים</label><textarea name="moments" style="min-height:96px" placeholder="שורה לכל רגע">'+esc(lines(d.moments))+'</textarea><p class="hint">שורה לכל רגע. מה שנתפס במצלמה ושווה לחזור אליו</p></div>';
 h+='<div class="f"><label>הערות מהיום</label><textarea name="note" style="min-height:76px" placeholder="מה עבד, מה פספסנו, למה לחזור">'+esc(d.note||"")+'</textarea></div>';
 h+='<div class="s-foot" style="border:0;padding:0"><button class="btn" data-act="saveday" data-id="'+esc(d.k)+'">שמור</button>';
 h+='<button class="btn ghost" data-act="cancelgrp">ביטול</button>';
 h+='<div class="spacer"></div><button class="btn danger" data-act="delday" data-id="'+esc(d.k)+'">מחק יום</button></div>';
 return h+'</div>';
}

 h+='<span class="meta">'+all.length+' ימי צילום</span></div>';
 h+='<p class="grp-note">יומן של החומר שכבר בקופסה. כל יום צילום עם התאריך, המיקום, מי צולם, והרגעים שכדאי לזכור כשחוזרים לחומר הגלם. זה המקום לרשום את מה שראית במצלמה ולא נכנס עדיין לשום סצנה.</p>';

  h+='<div class="dempty"><b>עוד לא נרשם אף יום צילום</b><p>לחץ על "הוסף יום צילום" למעלה כדי לפתוח את הראשון.</p></div>';

 }

  });

 }
 h+='<div class="dlog">';

 all.forEach(function(d){
  var mk=monthKey(d.date);
  if(mk!==lastM){ lastM=mk; h+='<div class="dmonth">'+esc(monthLabel(d.date))+'</div>'; }
  h+='<article class="dday">';

  h+='<div class="dtitle"><h3>'+esc(d.loc||"בלי מיקום")+'</h3>';

  h+='<div class="dwho">';

  h+='</div>';
  if((d.moments||[]).length){
   h+='<div class="dsec"><h4>רגעים חזקים</h4><ul class="dmoments">';
   d.moments.forEach(function(x){h+='<li>'+esc(x)+'</li>'});
   h+='</ul></div>';
  }
  if(d.note) h+='<div class="dsec note"><h4>הערות מהיום</h4><p>'+esc(d.note)+'</p></div>';
  h+='</article>';
 });
 h+='</div>';
 return h+'</section>';
}

/* ===== צריך לצלם ===== */
function openScenes(){
 return DATA.scenes.filter(function(s){return s.status==="todo"||s.status==="partial"});
}
function needGroups(mode){
 var g=[];
 if(mode==="line"){
  LINES().forEach(function(l){g.push({k:"l:"+l.k,name:l.name,sub:l.what||"",color:l.color||"#455160",
   f:function(s){return lineOf(s)===l.k}})});
  g.push({k:"l:none",name:"בלי ליין",sub:"סצנות שלא שייכות לשום סיפור",color:"#8A93A0",
   f:function(s){return !lineOf(s)}});
 } else if(mode==="ep"){
  DATA.eps.forEach(function(e){g.push({k:"e:"+e.n,name:"פרק "+e.n+" · "+e.title,sub:e.sub||"",color:"#4A5A6B",
   f:function(s){return s.ep===e.n}})});
 } else {
  DATA.chars.forEach(function(c){g.push({k:"c:"+c.k,name:c.name,sub:c.role||"",color:c.color||"#455160",
   gaps:c.gaps||[],f:function(s){return inScene(s,c.k)}})});
  g.push({k:"c:none",name:"בלי דמות",sub:"",color:"#8A93A0",f:function(s){return !charOf(s.char)}});
 }
 return g;
}

   }
   h+='</div>';
  });
  h+='</div>';
 });
 return h+'</div></section>';

function parseIdeas(txt){
 var res={made:0,unknownChar:[]};
 String(txt||"").split("\n").forEach(function(raw){
  var line=raw.trim();
  if(!line||line.charAt(0)==="#"||line.indexOf("|")<0) return;
  var p=line.split("|");
  var title=(p[0]||"").replace(/^[-*\d.\s]+/,"").trim();
  var why=(p[1]||"").trim();
  var cn=(p[2]||"").trim();
  var ep=parseInt((p[3]||"").replace(/\D/g,""),10)||1;
  var kind=(p[4]||"").trim();
  if(!title) return;
  var ck="", nrm=function(x){return String(x||"").replace(/[״"'׳`.,]/g,"").replace(/\s+/g," ").trim()};
  var cnn=nrm(cn);
  if(cnn){
   DATA.chars.forEach(function(c){ if(!ck&&nrm(c.name)===cnn) ck=c.k });
   if(!ck) DATA.chars.forEach(function(c){
    var a=nrm(c.name);
    if(!ck&&(a.indexOf(cnn)>-1||cnn.indexOf(a)>-1)) ck=c.k;
   });
   if(!ck) DATA.chars.forEach(function(c){
    var w=nrm(c.name).split(" ");
    if(!ck&&w.some(function(x){return x.length>2&&cnn.indexOf(x)>-1})) ck=c.k;
   });
   if(!ck) res.unknownChar.push(cn);
  }
  DATA.ideas=DATA.ideas||[];
  DATA.ideas.unshift({id:"g"+Date.now().toString(36)+Math.floor(Math.random()*9999),
   title:title, why:why+(kind?"  ["+kind+"]":""), char:ck, unit:unitGuess(ck),
   ep:Math.min(Math.max(ep,1),EPISODES), from:"chat"});
  res.made++;
 });
 return res;
}

function parseLines(txt){

 var pal=["#B0472B","#1B4B8F","#8A2D8F","#9A6206","#0C6B75","#5B3FA8","#166F5B","#4A5A6B","#A8305C","#7A6A1E","#6B4A2E","#1BA3A8","#2F3A4A"];
 String(txt||"").split("\n").forEach(function(raw){
  var line=raw.trim();
  if(!line||line.charAt(0)==="#"||line.indexOf("|")<0) return;
  var p=line.split("|");
  var name=(p[0]||"").replace(/^[-*\d.\s]+/,"").trim();
  var what=(p[1]||"").trim();
  var ids=(p[2]||"").split(/[,،;]/).map(function(x){return x.trim().toUpperCase()}).filter(Boolean);
  if(!name) return;
  var exist=LINES().filter(function(l){return l.name.trim()===name})[0];
  var k;
  if(exist){ k=exist.k; if(what&&!exist.what) exist.what=what; }
  else{
   k="l"+Date.now().toString(36)+Math.floor(Math.random()*9999);
   LINES().push({k:k,name:name,what:what,note:"נשלף מהתחקיר",color:pal[LINES().length%pal.length]});
   res.made.push(name);
  }
  ids.forEach(function(id){
   var sc=DATA.scenes.filter(function(x){return String(x.id).toUpperCase()===id})[0];
   if(sc){ sc.line=k; res.assigned++ } else res.unknown.push(id);
  });
 });
 return res;
}

 if(e.key==="Enter"&&state.newAt&&e.target&&e.target.name==="title"){e.preventDefault();createAt("todo");return}
 if(e.key==="Escape"&&state.showUsers&&(state.me||RO)){state.showUsers=false;render();return}
 if(e.key==="Escape"&&state.minePanel){state.minePanel=false;render();return}
 if(e.key==="Escape"&&state.charPanel){state.charPanel="";render();return}
 if(e.key==="Escape"&&state.newAt){state.newAt=null;render();return}
 if(e.key==="Escape"&&(state.editing||state.adding||state.editEp!==null||state.editMeta||state.editChar||state.editUnit||state.editLine||state.editDay)){
  state.editing=null;state.adding=false;state.editEp=null;state.editMeta=false;state.editChar=null;state.editUnit=null;state.editLine=null;state.editDay=null;render();
 }
});
document.addEventListener("input",function(e){
 if(e.target&&e.target.id==="trq"){
  state.trQ=e.target.value; state.trFocus=true;
  clearTimeout(window.__trT);
  window.__trT=setTimeout(function(){render()},260);
  return;
 }
 var f=e.target&&e.target.closest?e.target.closest("[data-form]"):null;
 if(f)f.setAttribute("data-dirty","1");
});
document.addEventListener("focusin",function(e){
 var t=e.target;
 if(!t||!t.closest||!t.closest(".modal"))return;
 setTimeout(function(){try{t.scrollIntoView({block:"center",behavior:"smooth"})}catch(_){}},240);
});
if(window.visualViewport){
 window.visualViewport.addEventListener("resize",function(){
  var a=document.activeElement;
  if(a&&a.closest&&a.closest(".modal")){setTimeout(function(){try{a.scrollIntoView({block:"center"})}catch(_){}},60)}
 });
}
window.addEventListener("scroll",saveUI,{passive:true});
document.addEventListener("scroll",function(e){
 if(e.target&&e.target.classList&&e.target.classList.contains("board"))saveUI();
},true);
loadUI();
loadMe();
if(!state.me&&!RO) state.showUsers=true;
useView();
state.writable=true;
render();
pull(true).then(function(n){
 if(n===0){ sent={}; pushRows().then(function(){toast("הפלטפורמה אותחלה עם התוכן הנוכחי")}); }
 startPoll();
});
})();
</script>
